[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grepxcel"
dynamic = ["version"]
description = "Pattern-based data extraction for Excel"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
suggest = [
    "llama-cpp-python>=0.2.90",
    "huggingface_hub>=0.23",
]
draft-cloud = [
    "anthropic>=0.40",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
grepxcel = "engine.cli:main"

[tool.setuptools.dynamic]
version = {attr = "engine.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["engine*"]
