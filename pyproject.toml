[build-system]
requires = ["setuptools>=77"]   # >=77 for PEP 639 SPDX license metadata
build-backend = "setuptools.build_meta"

[project]
name = "grepxcel"
dynamic = ["version"]
description = "Extract structured data from Excel files using a reusable pattern spreadsheet — no hardcoded row numbers"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "scpg" }]
keywords = [
    "excel", "xlsx", "spreadsheet", "data-extraction", "pattern", "etl", "openpyxl",
    "automation", "invoice", "structured-data", "data-pipeline", "mcp", "ai-agent",
    "extraction", "report", "template", "json", "csv",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Science/Research",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Utilities",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "openpyxl>=3.1",
    "defusedxml>=0.7",
    # `regex` (not stdlib `re`) for its hard per-match timeout= — our runtime
    # ReDoS guarantee. Floor is well past the old OSS-Fuzz memory-safety fixes.
    "regex>=2024.11.6",
    "structlog>=24.1",
    # Shell TAB completion for all subcommands and flags. No CVEs as of 2026-09.
    # Zero runtime cost when completion is not active (exits immediately if
    # _ARGCOMPLETE env vars are absent). Activate with:
    #   eval "$(register-python-argcomplete grepxcel)"
    "argcomplete>=3.3",
]

[project.optional-dependencies]
suggest = [
    "llama-cpp-python>=0.2.90",
    "huggingface_hub>=0.23",
    "platformdirs>=4.0",
    # Corporate TLS-inspection proxy support: lets grepxcel trust the OS
    # certificate store (where IT installs the company CA). Optional + guarded.
    "truststore>=0.9",
]
draft = [  # alias for [suggest] — matches the `grepxcel draft` command name
    "llama-cpp-python>=0.2.90",
    "huggingface_hub>=0.23",
    "platformdirs>=4.0",
    "truststore>=0.9",
]
draft-cloud = [
    "anthropic>=0.40",
    # openai SDK powers the GitHub Models backend (--backend github), which talks
    # to an OpenAI-compatible endpoint.
    "openai>=1.40",
    # google-genai supports the Gemini backend, which is disabled and planned
    # for a future release. Declared here so enabling it later is a one-liner.
    "google-genai>=0.3",
    "truststore>=0.9",   # corporate-proxy CA trust — see note in [suggest]
]
pandas = [
    "pandas>=2.0",
]
polars = [
    "polars>=1.0",
]
mcp = [
    "mcp>=1.23,<2",
]
wizard = [
    "textual>=8.0",
]
watch = [
    # watchdog>=4.0 for inotify/FSEvents/ReadDirectoryChangesW support.
    # No known CVEs as of 2026-09.
    "watchdog>=4.0",
]
web = [
    "fastapi>=0.141",
    "uvicorn>=0.52",
    "jinja2>=3.1",
    "aiofiles>=23.1",
]
dev = [
    "pytest>=8.0",
    "jsonschema>=4.20",
    "hypothesis>=6.168.0",
]
build = [
    # CVE-2025-59042 fixed in 6.10 (reworked bootstrap, eliminates sys.path injection)
    "pyinstaller>=6.10",
]

[project.urls]
Homepage = "https://github.com/scpg/grepxcel"
Repository = "https://github.com/scpg/grepxcel"
Issues = "https://github.com/scpg/grepxcel/issues"
Changelog = "https://github.com/scpg/grepxcel/blob/main/CHANGELOG.md"
Funding = "https://buymeacoffee.com/scpg.dev"

[project.scripts]
grepxcel = "grepxcel.cli:main"

[tool.setuptools.dynamic]
version = {attr = "grepxcel.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["grepxcel*"]

[tool.setuptools.package-data]
"grepxcel"            = ["py.typed"]
"grepxcel.examples"   = ["*/*.xlsx"]
"grepxcel.templates"  = ["*.html"]
"grepxcel.static"     = ["*.css", "*.js"]

[tool.bandit]
# Static security analysis of grepxcel's own source. Runs in CI's lint-security
# job; see CONTRIBUTING/CLAUDE.md for the local command.
#
# Only grepxcel/ is scanned. tests/ deliberately constructs hostile input — ZIP
# bombs, XXE payloads, oversized cells — and scanning it would report the test
# fixtures as vulnerabilities.
exclude_dirs = ["tests", "tmp.local", "samples.local", ".venv", "build", "dist"]

# CI gates at MEDIUM and above (-ll). The LOW findings in this codebase are all
# false positives of two shapes, and suppressing ~15 of them individually would
# train contributors to add `# nosec` reflexively — which is worse than not
# running the tool:
#   B105/B107  parser token NAMES ('not-null', 'nullable', 'trim-whitespace')
#              flagged as hardcoded passwords because the variable is *_token.
#   B603/B607  subprocess with a FIXED argv, no shell, guarded by shutil.which.
# A genuine LOW is still worth fixing when spotted; it just does not block a PR.
#
# Real suppressions live inline as `# nosec <ID> — <reason>` at the call site,
# where the justification sits next to the code it excuses.
