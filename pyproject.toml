[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grepxcel"
version = "0.1.0"
description = "Pattern-based data extraction for Excel"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1",
    "defusedxml>=0.7",
    "llama-cpp-python>=0.2.90",
    "huggingface_hub>=0.23",
]

[project.scripts]
grepxcel = "engine.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["engine*"]
