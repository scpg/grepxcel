version: 2
updates:

  # ── Python dependencies ──────────────────────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "UTC"
    target-branch: "dev"
    labels:
      - "dependencies"
    open-pull-requests-limit: 10
    ignore:
      # mcp 2.x removed `mcp.server.fastmcp`, which grepxcel/mcp_server.py
      # imports. A bump that widens the ceiling past <2 breaks `grepxcel mcp`
      # for every fresh install (see the comment on the [mcp] extra in
      # pyproject.toml). Remove this rule only together with the migration
      # to the mcp 2.x server API.
      - dependency-name: "mcp"
        versions: [">=2"]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(dev-deps)"
      include: "scope"
    groups:
      # Minor and patch bumps arrive as one PR per week instead of one per package.
      # Security fixes are intentionally excluded from groups so they stay
      # individual and can be merged urgently without waiting for the batch.
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # ── GitHub Actions ──────────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "09:00"
      timezone: "UTC"
    target-branch: "dev"
    labels:
      - "dependencies"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions-all:
        patterns:
          - "*"
