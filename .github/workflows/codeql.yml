name: CodeQL

# GitHub's own static analysis, free for public repositories. It complements
# rather than duplicates the bandit step in ci.yml: bandit is pattern-based and
# fast (it flags a dangerous CALL), CodeQL does interprocedural dataflow (it
# flags a dangerous call REACHED BY untrusted input). For a tool whose whole job
# is parsing untrusted .xlsx files, the taint-tracking view is the useful one.
#
# Results land in the repository's Security > Code scanning tab and annotate
# pull requests. Nothing is sent anywhere outside GitHub.
on:
  push:
    branches: [main, dev]
  pull_request:
  schedule:
    # Weekly, so newly published query packs are applied to code that has not
    # changed. Most real CodeQL findings on a stable codebase arrive this way —
    # the code stayed the same and the queries got better.
    - cron: '27 4 * * 1'

permissions: {}            # default: nothing; the job opts in below

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Python
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write   # upload results to the code-scanning API
      contents: read           # check out the repo

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: python
          # security-extended adds lower-severity and experimental queries on top
          # of the default set. Worth it here: the default pack is tuned to avoid
          # noise in large codebases, and this one is small enough to triage.
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:python
