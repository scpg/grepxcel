name: TestPyPI dry-run

# Rehearses the full publish pipeline against TestPyPI (test.pypi.org) — a
# disposable sandbox copy of PyPI. Run it manually from the Actions tab BEFORE
# the first real release to prove the build, the OIDC handshake, and the upload
# all work, without burning a version number on the real index.
#
# Manual-only (workflow_dispatch): it never fires on a tag, so it can never be
# confused with the real release (release.yml). Same Trusted-Publishing model as
# the real release — no tokens — but scoped to the separate 'testpypi'
# environment and the TestPyPI Trusted Publisher you register on test.pypi.org.
#
# Each run auto-derives a unique pre-release version X.Y.Zrc<run_number> from the
# current __version__ and rewrites it in the CI checkout only (never committed).
# So every dispatch uploads a FRESH version — no manual bumps, and the real
# __version__ (e.g. 0.3.0) stays untouched for the actual release.yml publish.
# (skip-existing stays on as a belt-and-suspenders for re-runs of the same run.)
#
# Pipeline:
#   build  →  publish-testpypi  →  smoke-test
#
# The smoke-test job installs the just-published package FROM test.pypi.org and
# runs an end-to-end extraction so we know the real PyPI release will work too.

on:
  workflow_dispatch:

permissions: {}            # default: nothing; each job opts in below

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    # Expose the derived version string so downstream jobs know what to install.
    outputs:
      version: ${{ steps.derive-version.outputs.version }}
    permissions:
      contents: read         # required to check out the repo (esp. while private)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"

      - name: Derive a unique pre-release version (X.Y.Zrc<run_number>)
        id: derive-version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          base=$(grep -E '^__version__' grepxcel/__init__.py \
                   | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          ver="${base}rc${RUN_NUMBER}"
          sed -i "s/^__version__ = .*/__version__ = \"${ver}\"/" grepxcel/__init__.py
          echo "Building TestPyPI version: ${ver}"
          echo "version=${ver}" >> "$GITHUB_OUTPUT"
          echo "### TestPyPI build: \`${ver}\`  (install with \`pip install --pre\`)" >> "$GITHUB_STEP_SUMMARY"

      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          twine check dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi    # must match the environment registered on TestPyPI
    permissions:
      id-token: write        # OIDC — the only permission needed; no password
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish via Trusted Publishing (OIDC) to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  smoke-test:
    name: Smoke-test install from TestPyPI
    needs: [build, publish-testpypi]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"

      # Retry pip install until TestPyPI CDN propagation reaches this runner.
      # Using pip itself as the retry loop is more reliable than a separate curl
      # poll: TestPyPI uses a multi-node CDN and a curl hit on one node does not
      # guarantee the pip node is updated.  --no-cache-dir prevents pip from
      # reusing a cached "version not found" response across retries.
      #
      # Why --extra-index-url?  test.pypi.org contains name-squatted or broken
      # stubs for popular names; grepxcel itself comes from TestPyPI and its
      # dependencies fall back to the real PyPI.
      - name: Wait for TestPyPI propagation and install grepxcel
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          MAX_WAIT=300
          INTERVAL=20
          ELAPSED=0
          until pip install --pre --no-cache-dir \
              --index-url https://test.pypi.org/simple/ \
              --extra-index-url https://pypi.org/simple/ \
              "grepxcel==${VERSION}"; do
            if [ "$ELAPSED" -ge "$MAX_WAIT" ]; then
              echo "Timed out after ${MAX_WAIT}s — grepxcel ${VERSION} not available via pip." >&2
              exit 1
            fi
            echo "Not yet available (${ELAPSED}s elapsed). Retrying in ${INTERVAL}s…"
            sleep "$INTERVAL"
            ELAPSED=$((ELAPSED + INTERVAL))
          done
          echo "Installed grepxcel ${VERSION} from TestPyPI after ${ELAPSED}s."

      - name: Verify installed version matches published tag
        # Run from /tmp so Python resolves 'import grepxcel' to site-packages,
        # not the checked-out source tree (whose __version__ is the pre-sed value).
        run: |
          installed=$(cd /tmp && python -c "import grepxcel; print(grepxcel.__version__)")
          expected="${{ needs.build.outputs.version }}"
          echo "Installed: ${installed}   Expected: ${expected}"
          if [ "$installed" != "$expected" ]; then
            echo "VERSION MISMATCH — smoke test failed" >&2
            exit 1
          fi

      # Install pytest (the only test dep; no source deps, no grepxcel dev extras).
      - name: Install pytest
        run: pip install pytest

      # Run from /tmp so 'import grepxcel' resolves to site-packages and not the
      # source tree that was checked out.  Pass the test directory as an absolute
      # path; --import-mode=importlib keeps pytest from adding extra sys.path entries.
      - name: Run smoke tests
        run: cd /tmp && pytest "$GITHUB_WORKSPACE/tests/smoke/" --import-mode=importlib -v

      - name: Write step summary
        if: always()
        run: |
          echo "### Smoke-test: grepxcel \`${{ needs.build.outputs.version }}\` from TestPyPI" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Install command: \`pip install --pre --index-url https://test.pypi.org/simple/ grepxcel==${{ needs.build.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
