name: TestPyPI dry-run

# Rehearses the full publish pipeline against TestPyPI (test.pypi.org) — a
# disposable sandbox copy of PyPI. Run it manually from the Actions tab BEFORE
# the first real release to prove the build, the OIDC handshake, and the upload
# all work, without burning a version number on the real index.
#
# Manual-only (workflow_dispatch): it never fires on a tag, so it can never be
# confused with the real release (release.yml). Same Trusted-Publishing model as
# the real release — no tokens — but scoped to the separate 'testpypi'
# environment and the TestPyPI Trusted Publisher you register on test.pypi.org.
#
# skip-existing: true lets you re-run the rehearsal repeatedly; TestPyPI rejects
# re-uploading an existing version, and this turns that into a skip, not a fail.

on:
  workflow_dispatch:

permissions: {}            # default: nothing; the publish job opts in below

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi    # must match the environment registered on TestPyPI
    permissions:
      id-token: write        # OIDC — the only permission needed; no password
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish via Trusted Publishing (OIDC) to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
