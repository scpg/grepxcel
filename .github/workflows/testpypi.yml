name: TestPyPI dry-run

# Rehearses the full publish pipeline against TestPyPI (test.pypi.org) — a
# disposable sandbox copy of PyPI. Run it manually from the Actions tab BEFORE
# the first real release to prove the build, the OIDC handshake, and the upload
# all work, without burning a version number on the real index.
#
# Manual-only (workflow_dispatch): it never fires on a tag, so it can never be
# confused with the real release (release.yml). Same Trusted-Publishing model as
# the real release — no tokens — but scoped to the separate 'testpypi'
# environment and the TestPyPI Trusted Publisher you register on test.pypi.org.
#
# Each run auto-derives a unique pre-release version X.Y.Zrc<run_number> from the
# current __version__ and rewrites it in the CI checkout only (never committed).
# So every dispatch uploads a FRESH version — no manual bumps, and the real
# __version__ (e.g. 0.3.0) stays untouched for the actual release.yml publish.
# (skip-existing stays on as a belt-and-suspenders for re-runs of the same run.)
#
# Pipeline:
#   build  →  publish-testpypi  →  smoke-test
#
# The smoke-test job installs the just-published package FROM test.pypi.org and
# runs an end-to-end extraction so we know the real PyPI release will work too.

on:
  workflow_dispatch:

permissions: {}            # default: nothing; each job opts in below

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    # Expose the derived version string so downstream jobs know what to install.
    outputs:
      version: ${{ steps.derive-version.outputs.version }}
    permissions:
      contents: read         # required to check out the repo (esp. while private)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"

      - name: Derive a unique pre-release version (X.Y.Zrc<run_number>)
        id: derive-version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          base=$(grep -E '^__version__' grepxcel/__init__.py \
                   | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          ver="${base}rc${RUN_NUMBER}"
          sed -i "s/^__version__ = .*/__version__ = \"${ver}\"/" grepxcel/__init__.py
          echo "Building TestPyPI version: ${ver}"
          echo "version=${ver}" >> "$GITHUB_OUTPUT"
          echo "### TestPyPI build: \`${ver}\`  (install with \`pip install --pre\`)" >> "$GITHUB_STEP_SUMMARY"

      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          twine check dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi    # must match the environment registered on TestPyPI
    permissions:
      id-token: write        # OIDC — the only permission needed; no password
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish via Trusted Publishing (OIDC) to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  smoke-test:
    name: Smoke-test install from TestPyPI
    needs: [build, publish-testpypi]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"

      # Poll the TestPyPI JSON API until the exact version appears (or timeout).
      # Typically propagates in 15–30 s; this avoids a fixed sleep while still
      # giving TestPyPI up to 5 minutes on slow days.
      - name: Wait for TestPyPI propagation (dynamic poll)
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          MAX_WAIT=300
          INTERVAL=15
          ELAPSED=0
          until curl -sf "https://test.pypi.org/pypi/grepxcel/${VERSION}/json" > /dev/null; do
            if [ "$ELAPSED" -ge "$MAX_WAIT" ]; then
              echo "Timed out after ${MAX_WAIT}s — grepxcel ${VERSION} not yet on TestPyPI." >&2
              exit 1
            fi
            echo "Not yet available (${ELAPSED}s elapsed). Retrying in ${INTERVAL}s…"
            sleep "$INTERVAL"
            ELAPSED=$((ELAPSED + INTERVAL))
          done
          echo "grepxcel ${VERSION} available on TestPyPI after ${ELAPSED}s."

      # Install the exact pre-release version we just published.
      #
      # Why two steps?  test.pypi.org is a sandbox and contains name-squatted
      # or broken stub packages for popular names (e.g. FASTAPI-1.0.tar.gz).
      # If we ask pip to satisfy the [web] extras from --index-url=test.pypi.org
      # it will find those stubs first and fail.  Solution: install the base
      # grepxcel package from test.pypi.org (proving the upload is correct), then
      # install the [web] extra dependencies separately from the real PyPI.
      - name: Install grepxcel (base) from TestPyPI
        run: |
          pip install --pre \
            --index-url https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple/ \
            "grepxcel==${{ needs.build.outputs.version }}"

      - name: Install web-extra dependencies from real PyPI
        run: pip install "fastapi>=0.141" "uvicorn>=0.52" "jinja2>=3.1"

      # Verify the installed __version__ matches what was published.
      - name: Verify installed version
        run: |
          installed=$(python -c "import grepxcel; print(grepxcel.__version__)")
          expected="${{ needs.build.outputs.version }}"
          echo "Installed: ${installed}   Expected: ${expected}"
          if [ "$installed" != "$expected" ]; then
            echo "VERSION MISMATCH — smoke test failed" >&2
            exit 1
          fi

      # Basic CLI checks: version flag + top-level help + web-wizard sub-help.
      - name: CLI help and version flag
        run: |
          grepxcel --version
          grepxcel --help
          grepxcel web-wizard --help

      # End-to-end extract: generate the built-in examples then run the engine on
      # one of them.  This exercises openpyxl, the pattern parser, and the engine
      # with zero external data files needed.
      - name: End-to-end extract (built-in example)
        run: |
          grepxcel generate-examples -o /tmp/gx-smoke
          grepxcel extract \
            -p /tmp/gx-smoke/01_simple_invoice/pattern.xlsx \
               /tmp/gx-smoke/01_simple_invoice/data.xlsx \
            -q

      # Validate-pattern on the same example just to exercise that code path too.
      - name: Validate pattern (no engine needed)
        run: grepxcel validate-pattern /tmp/gx-smoke/01_simple_invoice/pattern.xlsx -q

      - name: Write step summary
        if: always()
        run: |
          echo "### Smoke-test result: grepxcel \`${{ needs.build.outputs.version }}\` from TestPyPI" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Check | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| pip install (TestPyPI) | see job steps |" >> "$GITHUB_STEP_SUMMARY"
          echo "| version pin match | see job steps |" >> "$GITHUB_STEP_SUMMARY"
          echo "| CLI help / version flag | see job steps |" >> "$GITHUB_STEP_SUMMARY"
          echo "| end-to-end extract | see job steps |" >> "$GITHUB_STEP_SUMMARY"
          echo "| validate-pattern | see job steps |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Install command: \`pip install --pre --index-url https://test.pypi.org/simple/ grepxcel==${{ needs.build.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
