name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read           # least privilege: jobs only read the repo, nothing else

jobs:
  test:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        experimental: [false]
        include:
          - python-version: "3.15"
            experimental: true
            allow-prereleases: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: ${{ matrix.allow-prereleases || false }}
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -q

  package:
    # Smoke-test that the package installs and the console entry point works.
    # The test job above imports `grepxcel` via sys.path; this job validates the
    # actual installed artifact and the `grepxcel` script defined in pyproject.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package
        run: pip install .

      - name: Verify console entry point
        run: |
          grepxcel --help
          grepxcel extract --help
          grepxcel docs -o /tmp/gx-docs/
          test -f /tmp/gx-docs/pattern-reference.xlsx
          test -f /tmp/gx-docs/grepxcel-guide.docx

  package-extras:
    # Verify optional extras install cleanly and their entry points load.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extra: [mcp, draft-cloud, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package with [${{ matrix.extra }}]
        run: pip install '.[${{ matrix.extra }}]'

      - name: Smoke-test extra
        run: |
          grepxcel --help
          if [ "${{ matrix.extra }}" = "mcp" ]; then
            grepxcel mcp-config
          fi
          if [ "${{ matrix.extra }}" = "web" ]; then
            python -c "from grepxcel.wizard_api import create_app; print('web import ok')"
          fi

  test-dataframe:
    # The main `test` job installs neither pandas nor polars, so the extract_df()
    # DataFrame tests skip there. This lane installs each optional backend on its
    # own — exactly as a real user would (they install one, not both) — so those
    # tests actually run in CI instead of being silently skipped.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [pandas, polars]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package with [${{ matrix.backend }}] + test deps
        run: pip install '.[${{ matrix.backend }}]' -r requirements-dev.txt

      - name: Run DataFrame tests
        run: pytest tests/unit/test_extract_df.py tests/unit/test_output_quality.py -q

  cross-platform:
    # Smoke-test on macOS and Windows to catch path-separator bugs,
    # symlink differences, and platform-specific edge cases.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -q

  lint-security:
    # Generates problematic Excel fixtures (ZIP bomb, XXE injection, OLE-encrypted,
    # corrupt ZIP, macro extensions) and runs the lint security integration tests.
    # Only runs on pull_request — heavier than unit tests and needs network access
    # to download the real OLE-encrypted file from oletools test data.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Generate lint security fixtures
        run: python scripts/generate_lint_fixtures.py

      - name: Run lint security integration tests
        run: pytest tests/integration/test_lint_security.py -v

  docs-reference:
    # Verifies that docs/pattern-reference.xlsx can be regenerated and is current.
    # The file must be updated locally and included in the PR diff — branch
    # protection prevents direct commits from CI, so auto-commit is not used.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package
        run: pip install .

      - name: Regenerate docs
        run: grepxcel docs -o /tmp/gx-docs/

      - name: Check if committed files are current
        run: |
          outdated=0
          for f in pattern-reference.xlsx grepxcel-guide.docx; do
            if ! diff -q "docs/$f" "/tmp/gx-docs/$f" > /dev/null 2>&1; then
              echo "::warning::docs/$f is out of date. Run 'grepxcel docs -o docs/' locally and include the updated file in your PR."
              outdated=1
            else
              echo "docs/$f is current."
            fi
          done
          if [ "$outdated" -eq 1 ]; then exit 1; fi

      - name: Upload regenerated docs as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: grepxcel-docs
          path: /tmp/gx-docs/
