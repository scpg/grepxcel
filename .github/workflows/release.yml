name: Release

# Publishes grepxcel to PyPI when a version tag (v*) is pushed.
#
# Security model — no long-lived secrets exist anywhere:
#   • Authentication uses PyPI Trusted Publishing (OIDC). GitHub mints a
#     short-lived identity token at run time; PyPI verifies it came from THIS
#     repo + THIS workflow + the 'pypi' environment. There is no API token to
#     store, leak, or rotate.
#   • The build and publish steps are split so only the publish job holds the
#     id-token permission, and it holds nothing else.
#   • The 'pypi' environment can be configured with a required reviewer in the
#     repo settings to add a manual approval gate before any upload.
#   • The publish action also attaches PEP 740 attestations automatically,
#     giving every release a verifiable record of what built it and where.

on:
  push:
    tags:
      - "v*"

permissions: {}            # default: nothing; each job opts in to what it needs

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    permissions:
      contents: read         # required to check out the repo (esp. while private)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"

      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          twine check dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi        # must match the environment registered on PyPI
    permissions:
      id-token: write        # OIDC — the only permission needed; no password
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish via Trusted Publishing (OIDC)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        # No 'password:' — authentication is the OIDC handshake configured on PyPI.

  github-release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write        # required to create a GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Pull the section for this version from CHANGELOG.md
          notes=$(python3 -c "
          import re, sys, os
          text = open('CHANGELOG.md').read()
          ver = os.environ['VERSION']
          pattern = rf'## \[{re.escape(ver)}\].*?\n(.*?)(?=\n## |\Z)'
          m = re.search(pattern, text, re.DOTALL)
          print(m.group(1).strip() if m else f'Release {ver}')
          ")
          # Write to file to avoid shell escaping issues
          echo "$notes" > release_notes.md

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Generate SBOM (CycloneDX 1.6)
        run: |
          pip install dist/*.whl
          python -m grepxcel sbom -o sbom.cdx.json

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "grepxcel $VERSION" \
            --notes-file release_notes.md \
            dist/* sbom.cdx.json
