name: Oracle type-matrix

# Spec phase 6. The oracle suite is a PRE-PR GATE, not a per-push check: it runs
# ~25k generated cases and takes about two minutes, which is too slow for the
# push loop (see the "Pre-PR gate" section of CLAUDE.md). So unlike ci.yml this
# workflow has NO `push:` trigger — it runs only on pull requests, as the second
# opinion on whatever `scripts/oracle_check.py` reported locally.
#
# One Python version on purpose: the suite exercises grepxcel's own agreement
# with openpyxl and jsonschema, not Python-version portability, which ci.yml
# already covers across 3.11-3.15.
on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:      # so it can be re-run by hand without pushing

permissions:
  contents: read           # least privilege: read the repo, nothing else

concurrency:
  # A new push to the same PR supersedes the previous run — this suite is long
  # enough that queuing every intermediate commit wastes runner time.
  group: oracle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 20    # local full run is ~2 min; 20 is a generous hang guard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run the oracle type-matrix suite
        # -m oracle on the command line overrides the `-m "not oracle"` in
        # pytest.ini's addopts, which is what keeps this suite out of ci.yml.
        run: pytest -m oracle tests/oracle -q --junit-xml=oracle-results.xml

      - name: Confirm the fast suite still excludes the oracle marker
        # Guards the marker wiring itself: if addopts ever stopped excluding
        # `oracle`, ci.yml would silently inherit a two-minute suite. Compares
        # collected counts rather than trusting the config file.
        run: |
          fast=$(pytest tests/ --collect-only -q | tail -1)
          echo "fast suite collection: $fast"
          case "$fast" in
            *deselected*) echo "OK: oracle cases are deselected by default" ;;
            *) echo "FAIL: expected the oracle cases to be deselected"; exit 1 ;;
          esac

      - name: Upload results
        if: always()         # the XML is most useful precisely when the run failed
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oracle-results
          path: oracle-results.xml
          if-no-files-found: warn
