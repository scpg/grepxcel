[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
python_classes = Test*
empty_parameter_set_mark = skip
markers =
    oracle: slow generated type-matrix suite; excluded by default, run with -m oracle
    network: needs internet (verifies pinned CDN hashes against the live CDN); run with -m network
addopts = -m "not oracle and not network"
